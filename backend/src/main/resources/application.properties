spring.application.name=smartcrop-backend
# Hosting platforms (Render etc.) give the port in $PORT
server.port=${PORT:8080}

# ---- Flask ML API (runs next to Spring Boot) ----
flask.base-url=${FLASK_URL:http://127.0.0.1:5001}
flask.timeout-ms=10000

# ---- JWT: on a real deployment set the JWT_SECRET environment variable (32+ chars) ----
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration-minutes=480

# ---- CORS ----
smartcrop.cors.allowed-origins=${CORS_ORIGINS:*}

# ---- Demo login: username=demo password=demo123 ----
smartcrop.seed-demo-user=${SEED_DEMO_USER:true}

# ---- Database: H2 file in ./data (no install needed) ----
spring.datasource.url=jdbc:h2:file:./data/smartcrop
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Want MySQL locally? Copy application-local.properties.example to
# application-local.properties (git ignores it, so your password never reaches GitHub)
# and run with the profile "local".
